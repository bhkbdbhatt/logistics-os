[versions]
java = "21"
kotlin = "2.1.0"
springBoot = "3.4.1"
springCloud = "2024.0.0"
dependencyManagement = "1.1.7"
kafka = "3.7.1"
avro = "1.11.3"
confluent = "7.6.3"
postgresql = "42.7.4"
flyway = "10.20.1"
testcontainers = "1.20.4"
temporal = "1.25.0"
micrometerTracing = "1.4.1"
opentelemetry = "1.44.1"
junit = "5.10.3"
assertj = "3.26.3"
slf4j = "2.0.16"

[libraries]
# Spring Boot starters
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-webflux = { module = "org.springframework.boot:spring-boot-starter-webflux" }
spring-boot-starter-security = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-boot-starter-oauth2-resource-server = { module = "org.springframework.boot:spring-boot-starter-oauth2-resource-server" }
spring-boot-starter-oauth2-client = { module = "org.springframework.boot:spring-boot-starter-oauth2-client" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-data-jdbc = { module = "org.springframework.boot:spring-boot-starter-data-jdbc" }
spring-boot-starter-data-redis-reactive = { module = "org.springframework.boot:spring-boot-starter-data-redis-reactive" }

# Spring Kafka + Streams
spring-kafka = { module = "org.springframework.kafka:spring-kafka" }
spring-kafka-test = { module = "org.springframework.kafka:spring-kafka-test" }
kafka-streams = { module = "org.apache.kafka:kafka-streams" }
kafka-clients = { module = "org.apache.kafka:kafka-clients" }

# Avro + Confluent
avro = { module = "org.apache.avro:avro" }
avro-tools = { module = "org.apache.avro:avro-tools" }
confluent-kafka-avro-serializer = { module = "io.confluent:kafka-avro-serializer" }
confluent-schema-registry-client = { module = "io.confluent:kafka-schema-registry-client" }

# Storage / infra
postgresql = { module = "org.postgresql:postgresql" }
flyway-core = { module = "org.flywaydb:flyway-core" }
flyway-database-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }

# Temporal (used by L5 in Phase 2; shipped as a dependency of the stub only)
temporal-sdk = { module = "io.temporal:temporal-sdk", version.ref = "temporal" }

# Observability
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }
micrometer-tracing-bridge-otel = { module = "io.micrometer:micrometer-tracing-bridge-otel", version.ref = "micrometerTracing" }
opentelemetry-exporter-otlp = { module = "io.opentelemetry:opentelemetry-exporter-otlp", version.ref = "opentelemetry" }

# Tests
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
assertj = { module = "org.assertj:assertj-core", version.ref = "assertj" }
testcontainers-junit-jupiter = { module = "org.testcontainers:junit-jupiter", version.ref = "testcontainers" }
testcontainers-postgresql = { module = "org.testcontainers:postgresql", version.ref = "testcontainers" }
testcontainers-kafka = { module = "org.testcontainers:kafka", version.ref = "testcontainers" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
dependency-management = { id = "io.spring.dependency-management", version.ref = "dependencyManagement" }