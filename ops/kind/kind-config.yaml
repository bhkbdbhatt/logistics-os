# kind cluster for the release smoke test (docs/release-plan-0.2.0.md M3).
# A single all-in-one node is enough: services + a single-broker Kafka + the OTel collector all
# run in-cluster, and the smoke script reaches them via kubectl port-forward (no ingress needed).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: logistics-os
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"