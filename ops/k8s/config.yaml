# Shared non-secret configuration applied to every Logistics OS workload (ADR-0020, ADR-0021).
# Secrets (local JWT secret, DB password, IdP admin) belong in logistics-os-secrets, not here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: logistics-os-env
  namespace: logistics-os
  labels:
    app.kubernetes.io/part-of: logistics-os
data:
  KAFKA_BOOTSTRAP_SERVERS: "logistics-os-kafka.logistics-os.svc.cluster.local:9092"
  DEFAULT_TENANT: "tenant-1"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.logistics-os.svc.cluster.local:4317"

  # --- 0.3.0: identity (ADR-0020) ---
  # OIDC against the in-cluster Keycloak. Set LOGISTICS_SECURITY_MODE=local to fall back to HS256
  # dev tokens (then LOGISTICS_SECURITY_LOCAL_SECRET from the Secret is used).
  LOGISTICS_SECURITY_MODE: "oidc"
  LOGISTICS_SECURITY_OIDC_ISSUER_URI: "http://keycloak.logistics-os.svc.cluster.local:8080/realms/logistics-os"
  LOGISTICS_SECURITY_TENANT_CLAIM: "tenant_id"
  LOGISTICS_SECURITY_ROLES_CLAIM: "roles"

  # --- 0.3.0: persistence (ADR-0021) ---
  MDM_DB_URL: "jdbc:postgresql://postgres.logistics-os.svc.cluster.local:5432/mdm"
  MDM_DB_USER: "logistics"
