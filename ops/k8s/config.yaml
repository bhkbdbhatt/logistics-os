# Shared non-secret configuration applied to every Logistics OS workload.
# Secrets (Kafka auth, etc.) belong in a Secret, not here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: logistics-os-env
  namespace: logistics-os
  labels:
    app.kubernetes.io/part-of: logistics-os
data:
  KAFKA_BOOTSTRAP_SERVERS: "logistics-os-kafka.logistics-os.svc.cluster.local:9092"
  DEFAULT_TENANT: "tenant-1"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.logistics-os.svc.cluster.local:4317"