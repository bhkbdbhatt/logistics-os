apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Customer overlay: FedEx — Professional edition (no L5 orchestration).
# Deploy with: kubectl apply -k ops/k8s/overlays/fedex
namespace: logistics-os-fedex

resources:
  - namespace.yaml
  - ../..

commonLabels:
  customer: fedex

commonAnnotations:
  logistics-os.io/edition: professional

images:
  - name: ghcr.io/logistics-os/mdm
    newTag: fedex-0.2.0
  - name: ghcr.io/logistics-os/ingest-gateway
    newTag: fedex-0.2.0
  - name: ghcr.io/logistics-os/acl-tms
    newTag: fedex-0.2.0
  - name: ghcr.io/logistics-os/acl-wms
    newTag: fedex-0.2.0
  - name: ghcr.io/logistics-os/read-model-builder
    newTag: fedex-0.2.0
  - name: ghcr.io/logistics-os/control-tower
    newTag: fedex-0.2.0
  - name: ghcr.io/logistics-os/bff-ops
    newTag: fedex-0.2.0
  - name: ghcr.io/logistics-os/legacy-simulator
    newTag: fedex-0.2.0

patches:
  - path: config-patch.yaml