apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingest-gateway
  namespace: logistics-os
  labels:
    app.kubernetes.io/name: ingest-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ingest-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ingest-gateway
    spec:
      containers:
        - name: ingest-gateway
          image: ghcr.io/logistics-os/ingest-gateway:0.2.0
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: logistics-os-env
          env:
            - name: SERVER_PORT
              value: "8081"
          readinessProbe:
            tcpSocket:
              port: 8081
          resources:
            requests: {cpu: "100m", memory: "256Mi"}
            limits: {cpu: "500m", memory: "512Mi"}
---
apiVersion: v1
kind: Service
metadata:
  name: ingest-gateway
  namespace: logistics-os
spec:
  selector:
    app.kubernetes.io/name: ingest-gateway
  ports:
    - port: 8081
      targetPort: 8081