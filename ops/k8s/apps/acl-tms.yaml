apiVersion: apps/v1
kind: Deployment
metadata:
  name: acl-tms
  namespace: logistics-os
  labels:
    app.kubernetes.io/name: acl-tms
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: acl-tms
  template:
    metadata:
      labels:
        app.kubernetes.io/name: acl-tms
    spec:
      containers:
        - name: acl-tms
          image: ghcr.io/logistics-os/acl-tms:0.2.0
          ports:
            - containerPort: 8083
          envFrom:
            - configMapRef:
                name: logistics-os-env
          env:
            - name: SERVER_PORT
              value: "8083"
          readinessProbe:
            tcpSocket:
              port: 8083
          resources:
            requests: {cpu: "100m", memory: "256Mi"}
            limits: {cpu: "500m", memory: "512Mi"}
---
apiVersion: v1
kind: Service
metadata:
  name: acl-tms
  namespace: logistics-os
spec:
  selector:
    app.kubernetes.io/name: acl-tms
  ports:
    - port: 8083
      targetPort: 8083