# Keycloak reference IAM (ADR-0020). Imports the logistics-os realm (web client + roles + dev users).
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm
  namespace: logistics-os
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: logistics-os
data:
  realm-logistics-os.json: |
    {
      "realm": "logistics-os",
      "enabled": true,
      "displayName": "Logistics OS",
      "sslRequired": "external",
      "registrationAllowed": false,
      "loginWithEmailAllowed": true,
      "accessTokenLifespan": 3600,
      "roles": {
        "realm": [
          { "name": "viewer", "description": "Read-only access" },
          { "name": "operator", "description": "Can trigger one-click actions" },
          { "name": "admin", "description": "Administrative access" }
        ]
      },
      "clients": [
        {
          "clientId": "logistics-os-web",
          "name": "Logistics OS web console",
          "enabled": true,
          "protocol": "openid-connect",
          "publicClient": true,
          "standardFlowEnabled": true,
          "directAccessGrantsEnabled": true,
          "redirectUris": ["http://localhost:8092/*", "http://localhost:5173/*"],
          "webOrigins": ["+"],
          "attributes": { "pkce.code.challenge.method": "S256" },
          "protocolMappers": [
            {
              "name": "tenant_id",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-hardcoded-claim-mapper",
              "config": {
                "claim.name": "tenant_id",
                "claim.value": "tenant-1",
                "jsonType.label": "String",
                "access.token.claim": "true",
                "id.token.claim": "true"
              }
            },
            {
              "name": "roles",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-usermodel-realm-role-mapper",
              "config": {
                "claim.name": "roles",
                "multivalued": "true",
                "jsonType.label": "String",
                "access.token.claim": "true",
                "id.token.claim": "true"
              }
            }
          ]
        }
      ],
      "users": [
        {
          "username": "ops",
          "enabled": true,
          "email": "ops@example.com",
          "emailVerified": true,
          "credentials": [{ "type": "password", "value": "ops", "temporary": false }],
          "realmRoles": ["operator"]
        },
        {
          "username": "viewer",
          "enabled": true,
          "email": "viewer@example.com",
          "emailVerified": true,
          "credentials": [{ "type": "password", "value": "viewer", "temporary": false }],
          "realmRoles": ["viewer"]
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: logistics-os
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: logistics-os
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.0
          args: ["start-dev", "--import-realm"]
          ports:
            - containerPort: 8080
          env:
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: "admin"
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: logistics-os-secrets
                  key: KEYCLOAK_ADMIN_PASSWORD
            - name: KC_HOSTNAME
              value: "keycloak.logistics-os.svc.cluster.local"
            - name: KC_HOSTNAME_STRICT
              value: "false"
            - name: KC_HEALTH_ENABLED
              value: "true"
          volumeMounts:
            - name: realm
              mountPath: /opt/keycloak/data/import
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 5
          resources:
            requests: {cpu: "250m", memory: "512Mi"}
            limits: {cpu: "1", memory: "1Gi"}
      volumes:
        - name: realm
          configMap:
            name: keycloak-realm
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: logistics-os
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: logistics-os
spec:
  selector:
    app.kubernetes.io/name: keycloak
  ports:
    - port: 8080
      targetPort: 8080
