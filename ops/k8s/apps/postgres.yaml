# PostgreSQL 16 - system-of-record for MDM (jdbc profile) and future services (ADR-0021).
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: logistics-os
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: logistics-os
data:
  01-databases.sql: |
    -- One logical database per service.
    CREATE DATABASE mdm;
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: logistics-os
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: logistics-os
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: logistics-os
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: logistics-os
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: "logistics"
            - name: POSTGRES_DB
              value: "logistics"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: logistics-os-secrets
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "logistics"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: {cpu: "100m", memory: "256Mi"}
            limits: {cpu: "500m", memory: "1Gi"}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
        - name: init
          configMap:
            name: postgres-init
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: logistics-os
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: logistics-os
spec:
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - port: 5432
      targetPort: 5432
