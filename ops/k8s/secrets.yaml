# Development-default secrets for the reference stack. REPLACE before any real deployment
# (use External Secrets / Sealed Secrets / your cloud secret manager).
apiVersion: v1
kind: Secret
metadata:
  name: logistics-os-secrets
  namespace: logistics-os
  labels:
    app.kubernetes.io/part-of: logistics-os
type: Opaque
stringData:
  # HS256 signing secret for local-JSON mode (>= 32 bytes). Unused when mode=oidc.
  LOGISTICS_SECURITY_LOCAL_SECRET: "logistics-os-dev-secret-change-me-please-32bytes"
  # PostgreSQL credentials (shared bootstrap user; per-service DBs).
  POSTGRES_PASSWORD: "logistics"
  MDM_DB_PASSWORD: "logistics"
  # Keycloak bootstrap admin.
  KEYCLOAK_ADMIN_PASSWORD: "admin"
