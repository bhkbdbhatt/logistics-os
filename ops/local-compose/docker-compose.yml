services:
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: logistics-os-kafka
    healthcheck:
      test:
        - CMD-SHELL
        - "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1"
      interval: 5s
      timeout: 5s
      retries: 60
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:9092"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # The bootstrap service is the single creator of topics (declared in topics.lst).
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data

  # One-shot creator for all Phase-1 topics (see topics.lst). Re-running is a safe no-op.
  topic-bootstrap:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: "kafka:9092"
    entrypoint: ["/bin/bash", "/etc/topics/bootstrap.sh"]
    volumes:
      - ./scripts/bootstrap-topics.sh:/etc/topics/bootstrap.sh:ro
      - ./topics.lst:/etc/topics/topics.lst:ro
    restart: "no"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: logistics-os-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:9092"
    ports:
      - "8090:8080"

  # PostgreSQL 16 - system-of-record for MDM (jdbc profile) and future services (ADR-0021).
  # MDM connects with MDM_DB_URL=jdbc:postgresql://localhost:5432/mdm (see ops/local-compose/README.md).
  postgres:
    image: postgres:16
    container_name: logistics-os-postgres
    environment:
      POSTGRES_USER: logistics
      POSTGRES_PASSWORD: logistics
      POSTGRES_DB: logistics
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logistics"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Keycloak reference IAM (ADR-0020). Imports the logistics-os realm with the web client + roles.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: logistics-os-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8091:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro

  # Ops console. In local dev the SPA usually runs via `npm run dev`; this container mirrors the
  # k8s deployment (nginx serving the built SPA, reverse-proxying /ops,/auth to bff-ops).
  web:
    image: ghcr.io/logistics-os/web:${VERSION:-0.3.0}
    build:
      context: ../../web
    container_name: logistics-os-web
    depends_on:
      keycloak:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      BFF_OPS_URL: "http://host.docker.internal:8088"
      LOGISTICS_WEB_AUTH_MODE: "${WEB_AUTH_MODE:-local}"
      LOGISTICS_WEB_OIDC_ISSUER: "${WEB_OIDC_ISSUER:-}"
      LOGISTICS_WEB_OIDC_CLIENT_ID: "logistics-os-web"
    ports:
      - "8092:8080"

volumes:
  kafka-data:
  postgres-data: