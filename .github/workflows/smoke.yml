name: smoke

# End-to-end kind smoke test (docs/release-plan-0.2.0.md M3). Manual + nightly.
on:
  workflow_dispatch:
    inputs:
      overlay:
        description: "Customer overlay under ops/k8s/overlays (blank = base manifests)"
        required: false
        default: ""
      kind_load_local:
        description: "Build images locally and kind-load them (else pull published images)"
        type: boolean
        default: true
      teardown:
        description: "Delete the kind cluster at the end"
        type: boolean
        default: true
  schedule:
    # Nightly at 03:00 UTC against the base manifests.
    - cron: "0 3 * * *"

permissions:
  contents: read
  packages: read

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  smoke:
    name: kind smoke
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OVERLAY: ${{ github.event.inputs.overlay }}
      KIND_LOAD_LOCAL: ${{ github.event.inputs.kind_load_local || 'true' }}
      TEARDOWN: ${{ github.event.inputs.teardown || 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - uses: azure/setup-kubectl@v4

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: logistics-os
          config: ops/kind/kind-config.yaml

      - name: Log in to GHCR (published images only)
        if: env.KIND_LOAD_LOCAL != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Make wrapper executable
        run: chmod +x gradlew

      - name: Run smoke
        run: bash ops/kind/smoke.sh

      - name: Dump diagnostics on failure
        if: failure()
        run: |
          NS="logistics-os${OVERLAY:+-$OVERLAY}"
          kubectl -n "$NS" get pods -o wide || true
          kubectl -n "$NS" get events --sort-by=.lastTimestamp | tail -n 40 || true
          kubectl -n "$NS" logs -l app.kubernetes.io/part-of=logistics-os --tail=80 --prefix || true
