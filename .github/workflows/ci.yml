name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    name: Contract gates
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2g"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.12.1"
      - name: Validate generated schemas
        run: gradle :contracts:validation:validateSchemas --no-daemon
      - name: Reconcile registry vs docs + schemas
        run: bash contracts/scripts/reconcile.sh
      - name: Snapshot baselines are current
        run: bash contracts/scripts/snapshot-baselines.sh

  build:
    name: Build & tests
    needs: contracts
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2g"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.12.1"
      - name: Compile, test, assemble (includes embedded-Kafka ITs)
        run: gradle build --no-daemon
      - name: Smoke bootRun packaging (jar integrity)
        run: gradle classes testClasses --no-daemon